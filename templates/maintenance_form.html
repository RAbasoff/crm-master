{% extends "base.html" %}
{% block title %}{{ _('Add Maintenance') }} — {{ machine.name }} — CRM{% endblock %}
{% block content %}
<h1>🔧 {{ _('Add Maintenance') }} — {{ machine.name }}</h1>
<div class="card">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Maintenance Type') }} *</label>
                <select name="maintenance_type" required>
                    {% for t in ['preventive', 'corrective', 'inspection', 'overhaul'] %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>{{ _('Date Performed') }} *</label>
                <input type="date" name="date_performed" value="{{ now.strftime('%Y-%m-%d') }}" required>
            </div>
        </div>
        <div class="form-group">
            <label>{{ _('Description') }} *</label>
            <textarea name="description" rows="4" required placeholder="{{ _('Describe the maintenance work performed...') }}"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Cost') }} (€)</label>
                <input type="number" name="cost" value="0" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label>{{ _('Next Maintenance') }}</label>
                <input type="date" name="next_maintenance">
            </div>
        </div>
        <div class="form-group">
            <label>{{ _('Parts Used') }}</label>
            <textarea name="parts_used" rows="2" placeholder='[{"name": "Bearing 608ZZ", "quantity": 2}]'></textarea>
        </div>
        <div class="form-group">
            <label>{{ _('Notes') }}</label>
            <textarea name="notes" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>{{ _('Photos') }}</label>
            <input type="file" name="photos" multiple accept="image/*">
        </div>
        <button type="submit" class="btn btn-success">{{ _('Save') }}</button>
        <a href="/machines/{{ machine.id }}" class="btn" style="background:#eee">{{ _('Cancel') }}</a>
    </form>
</div>
{% endblock %}
