{% extends "base.html" %}
{% block title %}{{ _('Edit Event') if event else _('New Event') }} — ProMaster{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ _('Edit Event') if event else _('New Event') }}</h1>
    <a href="/works-calendar" class="btn btn-sm" style="background:#eee">{{ _('Back') }}</a>
</div>
<div class="card" style="max-width:560px">
    <form method="POST">
        <div class="form-group">
            <label>{{ _('Title') }} *</label>
            <input type="text" name="title" value="{{ event.title if event else '' }}" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Start') }} *</label>
                <input type="date" name="date_start" value="{{ event.date_start.strftime('%Y-%m-%d') if event and event.date_start else '' }}" required>
            </div>
            <div class="form-group">
                <label>{{ _('End') }}</label>
                <input type="date" name="date_end" value="{{ event.date_end.strftime('%Y-%m-%d') if event and event.date_end else '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>{{ _('Type') }}</label>
            <select name="event_kind">
                {% for k, label in [('work', _('Work')), ('meeting', _('Meeting')), ('move', _('Move')), ('important', _('Important'))] %}
                <option value="{{ k }}" {% if event and event.event_kind == k %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>{{ _('Description') }}</label>
            <textarea name="description" rows="3">{{ event.description if event else '' }}</textarea>
        </div>
        <div style="display:flex;gap:8px">
            <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
            <a href="/works-calendar" class="btn" style="background:#eee">{{ _('Cancel') }}</a>
        </div>
    </form>
</div>
{% endblock %}
