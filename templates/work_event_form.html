{% extends "base.html" %}
{% block title %}{{ _('Edit Event') if event else _('New Event') }} — ProMaster{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ _('Edit Event') if event else _('New Event') }}</h1>
    <a href="/works-calendar" class="btn btn-sm" style="background:#eee">{{ _('Back') }}</a>
</div>
<div class="card" style="max-width:560px">
    <form method="POST">
        <div class="form-group">
            <label>{{ _('Title') }} *</label>
            <input type="text" name="title" value="{{ event.title if event else '' }}" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Start') }} *</label>
                <input type="date" name="date_start" value="{{ event.date_start.strftime('%Y-%m-%d') if event and event.date_start else '' }}" required>
            </div>
            <div class="form-group">
                <label>{{ _('End') }}</label>
                <input type="date" name="date_end" value="{{ event.date_end.strftime('%Y-%m-%d') if event and event.date_end else '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>{{ _('Type') }}</label>
            <select name="event_kind">
                {% for k, label in [('work', _('Work')), ('meeting', _('Meeting')), ('move', _('Move')), ('important', _('Important'))] %}
                <option value="{{ k }}" {% if event and event.event_kind == k %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Importance') }}</label>
                <select name="priority">
                    <option value="low" {% if event and event.priority == 'low' %}selected{% endif %}>{{ _('Low') }}</option>
                    <option value="normal" {% if not event or event.priority in (None, 'normal') %}selected{% endif %}>{{ _('Normal') }}</option>
                    <option value="high" {% if event and event.priority == 'high' %}selected{% endif %}❗ {{ _('High') }}</option>
                    <option value="critical" {% if event and event.priority == 'critical' %}selected{% endif %}🔴 {{ _('Critical') }}</option>
                </select>
            </div>
            <div class="form-group">
                <label>{{ _('Color') }}</label>
                <input type="color" name="color" value="{{ event.color if event and event.color else '#3498db' }}" style="width:100%;height:36px;padding:2px;cursor:pointer">
            </div>
        </div>
        <div class="form-group">
            <label>{{ _('Recurrence') }}</label>
            <select name="recurrence">
                <option value="none" {% if not event or event.recurrence in (None, 'none') %}selected{% endif %}>{{ _('No repeat') }}</option>
                <option value="daily" {% if event and event.recurrence == 'daily' %}selected{% endif %}>{{ _('Daily') }}</option>
                <option value="weekly" {% if event and event.recurrence == 'weekly' %}selected{% endif %}>{{ _('Weekly') }}</option>
                <option value="biweekly" {% if event and event.recurrence == 'biweekly' %}selected{% endif %}>{{ _('Every 2 weeks') }}</option>
                <option value="monthly" {% if event and event.recurrence == 'monthly' %}selected{% endif %}>{{ _('Monthly') }}</option>
            </select>
        </div>
        <div class="form-group">
            <label>{{ _('Description') }}</label>
            <textarea name="description" rows="3">{{ event.description if event else '' }}</textarea>
        </div>
        <div style="display:flex;gap:8px">
            <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
            <a href="/works-calendar" class="btn" style="background:#eee">{{ _('Cancel') }}</a>
        </div>
    </form>
</div>
{% endblock %}
