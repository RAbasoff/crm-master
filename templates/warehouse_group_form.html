{% extends "base.html" %}
{% block title %}{{ _('Edit group') if group else _('New group') }} — CRM{% endblock %}
{% block content %}
<h1>{{ _('Edit group') + ': ' + group.name if group else _('New warehouse group') }}</h1>
<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Name') }} *</label>
                <input type="text" name="name" value="{{ group.name if group else '' }}" required placeholder="{{ _('Group name') }}">
            </div>
            <div class="form-group">
                <label>{{ _('Manufacturer') }}</label>
                <input type="text" name="manufacturer" value="{{ group.manufacturer if group else '' }}" list="manufacturers" placeholder="{{ _('Select or enter') }}">
                <datalist id="manufacturers">
                    {% for m in manufacturers %}
                    <option value="{{ m }}">
                    {% endfor %}
                </datalist>
            </div>
        </div>
        <div class="form-group">
            <label>{{ _('Description') }}</label>
            <textarea name="description" rows="2" placeholder="{{ _('Group description') }}">{{ group.description if group else '' }}</textarea>
        </div>
        <div style="display:flex;gap:8px">
            <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
            <a href="/warehouse/groups" class="btn" style="background:#eee">{{ _('Cancel') }}</a>
        </div>
    </form>
</div>
{% endblock %}
