{% extends "base.html" %}
{% block title %}{{ _('Plan') }} Moeskroen — CRM{% endblock %}
{% block content %}
<div class="page-header">
    <h1>📐 {{ _('Plan') }} — Moeskroen</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="/moeskroen" class="btn btn-sm" style="background:#eee">← {{ _('Back') }}</a>
        <a href="/moeskroen/map" class="btn btn-sm" style="background:#2c3e50;color:white">🧊 3D</a>
    </div>
</div>

<div class="toolbar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:8px;background:#f7fafc;border:1px solid #dde4ea;border-radius:8px">
    <form method="POST" action="/moeskroen/plan/bg" enctype="multipart/form-data" style="display:flex;gap:6px;align-items:center">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label style="font-size:12px;color:#555">{{ _('Background image') }}:</label>
        <input type="file" name="bg" accept="image/*" style="font-size:12px">
        <button type="submit" class="btn btn-sm" style="background:#2980b9;color:white">{{ _('Upload') }}</button>
    </form>
    <span style="flex:1"></span>
    <a href="{{ map_bg_url }}" target="_blank" class="btn btn-sm" style="background:#eee">{{ _('Open') }} ⤢</a>
</div>

<div id="planWrap" style="position:relative;width:100%;height:82vh;min-height:520px;background:#fff;border-radius:10px;overflow:auto;border:1px solid #b0bec5">
    <img id="planBg" src="{{ map_bg_url }}" alt="Moeskroen plan"
         style="display:block;width:100%;height:auto"
         onerror="this.onerror=null;this.src='/static/moeskroen_plan_2d.jpg'">
</div>
{% endblock %}
