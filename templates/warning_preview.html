<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warning Preview</title>
<style>
    body { margin: 0; font-family: Arial, sans-serif; background: #1a1a1a; color: white; height: 100vh; }
    .page { padding: 40px; }
    h1 { color: #ccc; }
    .card { background: #2a2a2a; padding: 20px; border-radius: 10px; margin: 20px 0; }
</style>
</head>
<body>
<div class="page">
    <h1>Страница приложения (пример)</h1>
    <div class="card">Контент страницы...</div>
</div>

<!-- WARNING POPUP -->
<div id="lowStockWarning" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;display:flex;justify-content:center;align-items:center">
    <div id="flashBox" style="background:#e74c3c;padding:40px 60px;border-radius:20px;text-align:center;max-width:500px;box-shadow:0 0 60px rgba(231,76,60,0.8)">
        <div style="font-size:64px;margin-bottom:16px">⚠️</div>
        <div style="font-size:28px;font-weight:900;color:#000;margin-bottom:12px">ВНИМАНИЕ!</div>
        <div style="font-size:22px;font-weight:700;color:#000;margin-bottom:8px">Осталось 4 полных баллона N₂</div>
        <div style="font-size:18px;font-weight:600;color:#111;margin-bottom:20px">НЕОБХОДИМО СДЕЛАТЬ ЗАЯВКУ!</div>
        <button onclick="document.getElementById('lowStockWarning').style.display='none'" style="padding:12px 30px;font-size:16px;font-weight:700;border:3px solid #000;background:white;border-radius:10px;cursor:pointer">ПОНЯТНО</button>
    </div>
</div>

<script>
// Flash effect for 5 seconds
const box = document.getElementById('flashBox');
let flashCount = 0;
const flashInterval = setInterval(() => {
    box.style.background = flashCount % 2 === 0 ? '#000' : '#e74c3c';
    box.querySelectorAll('div').forEach(d => {
        if (!d.querySelector('button')) d.style.color = flashCount % 2 === 0 ? '#fff' : '#000';
    });
    flashCount++;
    if (flashCount >= 10) {
        clearInterval(flashInterval);
        box.style.background = '#e74c3c';
        box.querySelectorAll('div').forEach(d => d.style.color = '#000');
    }
}, 500);
</script>
</body>
</html>
