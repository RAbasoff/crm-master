<!DOCTYPE html>
<html lang="{{ g.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Login') }} — ProMaster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1629; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        body::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 40%, rgba(91,156,246,0.08) 0%, transparent 50%), radial-gradient(circle at 70% 60%, rgba(91,156,246,0.05) 0%, transparent 50%); }
        .login-card { background: #161b22; border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 420px; box-shadow: 0 24px 80px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); position: relative; z-index: 1; }
        .login-card .logo-wrap { text-align: center; margin-bottom: 28px; }
        .login-card .logo-icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #5b9cf6, #3b7dd8); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; box-shadow: 0 8px 24px rgba(91,156,246,0.3); }
        .login-card .logo-text { font-size: 20px; font-weight: 800; color: #e6edf3; letter-spacing: -0.3px; }
        .login-card .logo-text span { color: #5b9cf6; }
        .login-card .logo-sub { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #8b949e; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #30363d; border-radius: 10px; font-size: 15px; background: #0d1117; color: #e6edf3; transition: all 0.2s; }
        .form-group input:focus { border-color: #5b9cf6; outline: none; box-shadow: 0 0 0 3px rgba(91,156,246,0.15); }
        .form-group input::placeholder { color: #484f58; }
        .btn { width: 100%; padding: 13px; background: #5b9cf6; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #4a8be5; box-shadow: 0 4px 16px rgba(91,156,246,0.3); }
        .btn:active { transform: scale(0.98); }
        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; border: 1px solid; }
        .alert-error { background: #f8d7da22; color: #f8868d; border-color: #f8868d33; }
        .alert-success { background: #d4edda22; color: #56d67a; border-color: #56d67a33; }
        .alert-info { background: #d1ecf122; color: #5b9cf6; border-color: #5b9cf633; }
        .lang-switch { text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #21262d; }
        .lang-switch a { color: #484f58; text-decoration: none; margin: 0 10px; font-size: 12px; font-weight: 600; transition: color 0.15s; }
        .lang-switch a:hover { color: #8b949e; }
        .lang-switch a.active { color: #5b9cf6; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-wrap">
            <div class="logo-icon">🔧</div>
            <div class="logo-text">A.B.A.S.O.F.F. <span>ProMaster</span></div>
            <div class="logo-sub">CRM {{ _('System') }}</div>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>{{ _('Username') }}</label>
                <input type="text" name="username" required autofocus placeholder="{{ _('Enter username') }}">
            </div>
            <div class="form-group">
                <label>{{ _('Password') }}</label>
                <input type="password" name="password" required placeholder="{{ _('Enter password') }}">
            </div>
            <button type="submit" class="btn">{{ _('Login') }}</button>
        </form>
        <div class="lang-switch">
            {% for code, name in g.LANGUAGES.items() %}
                <a href="/set_language/{{ code }}" class="{% if g.lang == code %}active{% endif %}">{{ code|upper }}</a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
