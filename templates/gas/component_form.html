{% extends "base.html" %}
{% block title %}{{ _('Edit Component') if component else _('New Component') }} — CRM{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ _('Edit Component') if component else _('New Component') }}</h1>
</div>
<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Gas Type') }} *</label>
                <select name="gas_type" required>
                    <option value="nitrogen" {% if component and component.gas_type == 'nitrogen' %}selected{% endif %}>N₂ {{ _('Nitrogen') }}</option>
                    <option value="co2" {% if component and component.gas_type == 'co2' %}selected{% endif %}>CO₂ {{ _('Carbon Dioxide') }}</option>
                </select>
            </div>
            <div class="form-group">
                <label>{{ _('Component Type') }} *</label>
                <select name="component_type" required>
                    {% for val, label in [('valve', 'Valve'), ('regulator', 'Regulator'), ('heater', 'Heater'), ('manometer', 'Manometer'), ('shut_off', 'Shut-off')] %}
                    <option value="{{ val }}" {% if component and component.component_type == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>{{ _('Name') }} *</label>
            <input type="text" name="name" value="{{ component.name if component else '' }}" required placeholder="{{ _('Component name') }}">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Status') }}</label>
                <select name="status">
                    {% for val, label in [('ok', 'OK'), ('warning', 'Warning'), ('faulty', 'Faulty'), ('replaced', 'Replaced')] %}
                    <option value="{{ val }}" {% if component and component.status == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>{{ _('Last Check') }}</label>
                <input type="date" name="last_check" value="{{ component.last_check.strftime('%Y-%m-%d') if component and component.last_check else '' }}">
            </div>
            <div class="form-group">
                <label>{{ _('Next Check') }}</label>
                <input type="date" name="next_check" value="{{ component.next_check.strftime('%Y-%m-%d') if component and component.next_check else '' }}">
            </div>
        </div>
        <div class="form-group">
            <label>{{ _('Notes') }}</label>
            <textarea name="notes" rows="3">{{ component.notes if component else '' }}</textarea>
        </div>
        <div style="display:flex;gap:8px">
            <button type="submit" class="btn btn-primary">{{ _('Save') }}</button>
            <a href="/gas/components" class="btn" style="background:#eee">{{ _('Cancel') }}</a>
        </div>
    </form>
    {% if component %}
    <form method="POST" action="/gas/components/{{ component.id }}/delete" style="margin-top:12px" onsubmit="return confirm('{{ _('Delete this component?') }}')">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-danger">{{ _('Delete') }}</button>
    </form>
    {% endif %}
</div>
{% endblock %}
