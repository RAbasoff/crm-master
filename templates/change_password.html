{% extends "base.html" %}
{% block title %}{{ _('Change Password') }} — CRM{% endblock %}
{% block content %}
<div style="max-width:400px;margin:60px auto">
    <div class="card" style="padding:32px">
        <h1 style="text-align:center;margin-bottom:24px">🔐 {{ _('Change Password') }}</h1>
        {% if current_user.force_change_password %}
        <div style="background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:#856404">
            ⚠️ {{ _('You must change your password to continue') }}
        </div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>{{ _('New Password') }}</label>
                <input type="password" name="new_password" required minlength="8" autofocus>
            </div>
            <div class="form-group">
                <label>{{ _('Confirm Password') }}</label>
                <input type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">{{ _('Save') }}</button>
        </form>
    </div>
</div>
{% endblock %}
