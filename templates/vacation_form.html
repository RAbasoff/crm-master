{% extends "base.html" %}
{% block title %}{{ _('New Vacation Request') }} — CRM{% endblock %}
{% block content %}
<h1>🏖 {{ _('New Vacation Request') }}</h1>
<div class="card">
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>{{ _('Type') }} *</label>
                <select name="vacation_type" required>
                    {% for t in ['vacation', 'sick', 'personal', 'unpaid'] %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>{{ _('Reason') }}</label>
                <input type="text" name="reason">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group"><label>{{ _('Date From') }} *</label><input type="date" name="date_from" required></div>
            <div class="form-group"><label>{{ _('Date To') }} *</label><input type="date" name="date_to" required></div>
        </div>
        <button type="submit" class="btn btn-primary">{{ _('Submit') }}</button>
        <a href="/vacations" class="btn" style="background:#eee">{{ _('Cancel') }}</a>
    </form>
</div>
{% endblock %}
