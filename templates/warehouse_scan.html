{% extends "base.html" %}
{% block title %}{{ _('Scan Warehouse Item') }} — CRM{% endblock %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 style="margin:0;font-size:20px">📦 {{ _('Warehouse Scanner') }}</h1>
    <a href="/scanner" class="btn btn-sm" style="background:#eee">← {{ _('All Scanners') }}</a>
</div>

<!-- Scanner input -->
<div class="card" style="margin-bottom:16px;border:2px solid #3498db;padding:16px">
    <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:28px">📦</span>
        <div style="flex:1">
            <input type="text" id="scannerInput" placeholder="{{ _('Scan warehouse barcode or type name/code...') }}"
                style="width:100%;padding:12px;border:2px solid #3498db;border-radius:8px;font-size:16px;font-family:monospace;outline:none"
                onfocus="this.style.borderColor='#27ae60'" onblur="this.style.borderColor='#3498db'"
                autocomplete="off" autofocus>
            <div style="font-size:11px;color:#888;margin-top:4px">{{ _('Honeywell scanner ready — scan to auto-submit') }}</div>
        </div>
        <button id="btnCamera" class="btn btn-sm" style="background:#27ae60;color:white;display:none" onclick="toggleCamera()">📷 {{ _('Camera') }}</button>
    </div>
</div>

<!-- Camera (mobile only) -->
<div id="cameraBlock" style="display:none;margin-bottom:16px">
    <div class="card" style="padding:16px">
        <div id="reader" style="max-width:400px;margin:0 auto;border-radius:12px;overflow:hidden"></div>
    </div>
</div>

<!-- Result -->
<div id="resultArea" style="display:none;margin-bottom:16px">
    <div class="card" id="resultCard" style="border-left:4px solid #3498db">
        <div id="resultContent"></div>
    </div>
</div>

<!-- Scan history -->
<div id="historyArea" style="display:none">
    <div class="card">
        <h3 style="margin:0 0 12px;font-size:14px">{{ _('Scan History') }}</h3>
        <div id="historyList"></div>
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/static/js/scanner-common.js"></script>
<script>
const history = [];
let lastScan = '';
let lastScanTime = 0;
let cameraActive = false;
let scanner = null;

const scannerInput = document.getElementById('scannerInput');

ScannerCommon.init({
    inputId: 'scannerInput',
    cameraBtnId: 'btnCamera',
    cameraBlockId: 'cameraBlock',
    onScan: processScan
});

// Camera toggle
function toggleCamera() {
    cameraActive = !cameraActive;
    document.getElementById('cameraBlock').style.display = cameraActive ? '' : 'none';
    document.getElementById('btnCamera').textContent = cameraActive ? '⏹ Stop' : '📷 Camera';
    document.getElementById('btnCamera').style.background = cameraActive ? '#e74c3c' : '#27ae60';
    if (cameraActive && !scanner) startCamera();
    else if (!cameraActive && scanner) stopCamera();
}

function startCamera() {
    scanner = new Html5Qrcode('reader');
    scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        function(text) { processScan(text); },
        function() {}
    ).catch(function() {
        document.getElementById('cameraBlock').innerHTML = '<div style="padding:20px;text-align:center;color:#e74c3c">Camera not available. Use external scanner.</div>';
        scanner = null;
    });
}

function stopCamera() {
    if (scanner) {
        scanner.stop().then(function() { scanner.clear(); scanner = null; });
    }
}

function processScan(code) {
    if (code === lastScan && (Date.now() - lastScanTime) < 2000) return;
    lastScan = code;
    lastScanTime = Date.now();

    document.getElementById('resultArea').style.display = '';
    document.getElementById('resultContent').innerHTML = '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px">⏳</span> <b>' + code + '</b> — searching...</div>';
    document.getElementById('resultCard').style.borderLeftColor = '#3498db';

    csrfFetch('/api/warehouse/scan', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({code: code})
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.found) {
            showResult(d, code);
        } else {
            showNotFound(code);
        }
    })
    .catch(function() { showError(code); });

    history.unshift({ code: code, time: new Date().toLocaleTimeString() });
    updateHistory();
}

function showResult(d, code) {
    const card = document.getElementById('resultCard');
    card.style.borderLeftColor = '#27ae60';
    let html = '<div style="display:flex;align-items:center;gap:12px">';
    html += '<span style="font-size:28px">📦</span>';
    html += '<div>';
    html += '<div style="font-size:16px;font-weight:700">' + d.name + '</div>';
    html += '<div style="font-size:12px;color:#888">';
    if (d.category) html += d.category + ' · ';
    html += 'Qty: ' + d.quantity + ' ' + (d.unit || '');
    if (d.price) html += ' · €' + d.price;
    html += '</div>';
    if (d.available) html += '<div style="font-size:11px;color:#27ae60;margin-top:2px">✓ {{ _("In stock") }}</div>';
    else html += '<div style="font-size:11px;color:#e74c3c;margin-top:2px">✗ {{ _("Out of stock") }}</div>';
    html += '</div></div>';
    html += '<div style="display:flex;gap:8px;margin-top:12px">';
    html += '<a href="/warehouse/' + d.id + '/edit" class="btn btn-sm" style="background:#3498db;color:white;text-decoration:none">✏️ {{ _("Edit") }}</a>';
    html += '<a href="/warehouse/' + d.id + '" class="btn btn-sm" style="background:#eee;text-decoration:none">📋 {{ _("Details") }}</a>';
    html += '</div>';
    document.getElementById('resultContent').innerHTML = html;
}

function showNotFound(code) {
    const card = document.getElementById('resultCard');
    card.style.borderLeftColor = '#f39c12';
    let html = '<div style="display:flex;align-items:center;gap:12px">';
    html += '<span style="font-size:28px">❓</span>';
    html += '<div><div style="font-size:14px;font-weight:600">' + code + '</div>';
    html += '<div style="font-size:12px;color:#888">{{ _("Item not found in warehouse") }}</div></div></div>';
    html += '<div style="display:flex;gap:8px;margin-top:12px">';
    html += '<button onclick="window.location.href=\'/warehouse/new?barcode=' + encodeURIComponent(code) + '\'" class="btn btn-sm" style="background:#27ae60;color:white;cursor:pointer">+ {{ _("Add to Warehouse") }}</button>';
    html += '<button onclick="document.getElementById(\'resultArea\').style.display=\'none\';document.getElementById(\'scannerInput\').focus()" class="btn btn-sm" style="background:#eee;cursor:pointer">{{ _("Ignore") }}</button>';
    html += '</div>';
    document.getElementById('resultContent').innerHTML = html;
}

function showError(code) {
    const card = document.getElementById('resultCard');
    card.style.borderLeftColor = '#e74c3c';
    document.getElementById('resultContent').innerHTML = '<div style="color:#e74c3c">❌ {{ _("Connection error") }}: ' + code + '</div>';
}

function updateHistory() {
    if (!history.length) return;
    document.getElementById('historyArea').style.display = '';
    document.getElementById('historyList').innerHTML = history.slice(0, 10).map(function(h) {
        return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid #f0f0f0"><span><code>' + h.code + '</code></span><span style="color:#888">' + h.time + '</span></div>';
    }).join('');
}
</script>
{% endblock %}
