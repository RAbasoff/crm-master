<!DOCTYPE html>
<html lang="{{ g.lang if g.lang is defined else 'ru' }}">
<head>
<meta charset="UTF-8">
<title>QR — {{ _('Warehouse') }}</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; padding: 14px; }
.bar { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
.bar button { padding:8px 16px; border:none; border-radius:8px; background:#2c3e50; color:#fff; cursor:pointer; font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.cell { border:1px solid #ccc; border-radius:8px; padding:8px; text-align:center; page-break-inside:avoid; }
.cell img { width:120px; height:120px; }
.cell .addr { font-size:14px; font-weight:700; margin-top:4px; letter-spacing:0.5px; }
.cell .cnt { font-size:10px; color:#888; margin-top:2px; }
@media print { .bar { display:none; } body { padding:4px; } }
</style>
</head>
<body>
<div class="bar">
    <button onclick="window.print()">&#128424; {{ _('Print') }}</button>
    <a href="/warehouse" style="font-size:13px;color:#2c3e50">{{ _('Back') }}</a>
    <span style="font-size:12px;color:#888">{{ labels|length }} {{ _('addresses') }}</span>
</div>
<div class="grid">
    {% for l in labels %}
    <div class="cell">
        <img src="data:image/png;base64,{{ l.img }}" alt="{{ l.addr }}">
        <div class="addr">{{ l.addr }}</div>
        <div class="cnt">{{ l.items }} {{ _('items') }}</div>
    </div>
    {% endfor %}
</div>
</body>
</html>
