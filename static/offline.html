<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — ProMaster</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e; color: #eee; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #16213e; border-radius: 16px; padding: 32px 28px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .icon { font-size: 56px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
  p { color: #aab; line-height: 1.5; margin-bottom: 20px; font-size: 15px; }
  button {
    background: #27ae60; color: #fff; border: 0; border-radius: 10px;
    padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #219150; }
  .hint { margin-top: 18px; font-size: 12px; color: #667; }
  a { color: #7fdbda; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Нет соединения</h1>
    <p>Приложение offline. Сохранённые страницы недоступны.<br>
       Проверьте сеть и попробуйте ещё раз.</p>
    <button onclick="location.href='/'">Повторить</button>
    <div class="hint">
      Посещённые ранее страницы откроются из кэша.<br>
      <a href="/mobile">Мобильный дашборд</a>
    </div>
  </div>
</body>
</html>
